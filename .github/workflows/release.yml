name: Release

# Publishing is automatic and starts with one command on your machine:
#
#   pnpm release:patch   (or :minor / :major)
#
# That script bumps the version in every recorded file, generates the
# CHANGELOG.md section from the conventional commits the release carries,
# commits, tags vX.Y.Z and pushes both. This workflow fires on that tag and
# is the whole rest of the pipeline: it builds the signed Windows installer,
# the Linux deb + AppImage and the universal macOS dmg, creates the GitHub
# release with the changelog section as its body, and uploads the update
# payloads (installers plus .sig) and latest.json.
#
# The jobs run one at a time (max-parallel: 1) because each one merges its
# platform entry into the same latest.json asset; running them in parallel
# would let one overwrite the other.
#
# The published release is what the in-app updater answers from: the app
# reads releases/latest/download/latest.json, verifies every package against
# the public key baked into the build, and never runs an update the key did
# not sign. Only stable v tags release; -rc / -beta tags are ignored.
#
# The tag is published as-is (not a draft): the bump command is the deliberate
# human action in the flow. To review before shipping instead, set
# releaseDraft: true below — latest.json only ever resolves to published,
# non-draft releases, so a draft cannot reach installed copies.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/bdownload.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  an empty string (the key has no password)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          # One universal binary, so Intel and Apple Silicon both get a build.
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the macOS build targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      - name: Read this version's notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          body="$(node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}")"
          {
            echo 'body<<EOF'
            echo "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "B Download Manager ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
