[package]
name = "my-idm-clone"
version = "1.1.1"
description = "A high performance multi-connection download manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "my_idm_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
idm-core = { path = "../crates/idm-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks"] }
futures-util = "0.3"
# The downloaded video helper is checked against its publisher's SHA-256 list
# before it is ever run.
sha2 = "0.10"
# The ffmpeg helper arrives as a zip from its publisher; only the one program
# this app runs is taken out of it.
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
# The pairing token of the browser bridge needs the operating system's random
# source, not a seeded generator. Already in the dependency graph, so this adds
# no build of its own.
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Dwm"] }
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Win32_Foundation"] }
# The `interface` macro expands to `windows_core::` paths, so the crate has to
# be a direct dependency, not just a re-export of `windows`.
windows-core = "0.62"
