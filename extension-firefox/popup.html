<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>B Download Manager</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="head">
        <img class="mark" src="icons/icon-48.png" alt="" width="18" height="18" />
        <h1>B Download Manager</h1>
      </header>

      <div class="status" role="status" aria-live="polite">
        <span class="dot" id="dot" data-state="checking" aria-hidden="true"></span>
        <span id="status-text">Checking the application</span>
        <button type="button" class="ghost" id="check">Check</button>
      </div>

      <label class="setting" for="takeover">
        <input type="checkbox" id="takeover" />
        <span class="setting-text">
          <span class="setting-title">Take over browser downloads</span>
          <span class="setting-hint">
            The browser stops the file and the application asks where to save it.
          </span>
        </span>
      </label>

      <label class="setting" for="panel">
        <input type="checkbox" id="panel" />
        <span class="setting-text">
          <span class="setting-title">Download button on pages</span>
          <span class="setting-hint">
            A corner button lists the media the page offers, and the toolbar
            badge counts them.
          </span>
        </span>
      </label>

      <section class="media" id="media" aria-labelledby="media-title" hidden>
        <h2 id="media-title">Media on this page</h2>
        <ul class="media-list" id="media-list"></ul>
        <p class="media-empty" id="media-empty" hidden>No media links on this page.</p>
      </section>
    </main>

    <footer class="foot">
      <span class="port" id="port"></span>
      <button type="button" class="ghost" id="settings">Settings</button>
    </footer>

    <script src="settings.js"></script>
    <script src="bridge.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
