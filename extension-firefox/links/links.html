<!doctype html>
<html lang="en" data-bdm-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Download all links</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="links.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img class="mark" src="../icons/icon-32.png" alt="" width="20" height="20" />
        <div class="head-text">
          <h1>Download all links</h1>
          <p class="page" id="page-name">Reading this page…</p>
        </div>
      </div>
      <button class="icon-button" id="close" type="button" aria-label="Close window">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>

    <div class="state" id="state" data-state="checking" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span class="state-text" id="state-text">Reading links…</span>
      <button class="text-button" id="retry" type="button" hidden>Retry</button>
    </div>

    <section class="toolbar" aria-label="Filters">
      <label class="field">
        <span>Category</span>
        <select id="category">
          <option value="">All categories</option>
        </select>
      </label>
      <label class="field">
        <span>Type</span>
        <select id="extension">
          <option value="">All types</option>
        </select>
      </label>
      <label class="toggle" id="pages-row" hidden>
        <input type="checkbox" id="pages" />
        <span>Page links</span>
        <span class="count" id="pages-count"></span>
      </label>
      <div class="toolbar-actions">
        <button class="text-button" id="select-shown" type="button">Select shown</button>
        <button class="text-button" id="clear-all" type="button">Clear</button>
      </div>
    </section>

    <section class="list-wrap">
      <ul class="links" id="links" role="list"></ul>
      <p class="empty" id="empty">Reading links…</p>
    </section>

    <section class="report" id="report" hidden aria-labelledby="report-title">
      <details open>
        <summary id="report-title">Report</summary>
        <ul class="report-list" id="report-list"></ul>
      </details>
    </section>

    <footer class="foot">
      <div class="choices">
        <label class="field">
          <span>Save to</span>
          <select id="folder">
            <option value="">App default</option>
          </select>
        </label>
        <label class="field narrow">
          <span>Queue</span>
          <select id="queue">
            <option value="now">Start now</option>
            <option value="main">Main queue</option>
          </select>
        </label>
        <label class="field narrow">
          <span>Connections</span>
          <input
            id="connections"
            type="number"
            min="1"
            max="32"
            step="1"
            inputmode="numeric"
            value="8"
            title="Connections for each link. The application's connection budget caps the whole batch."
          />
        </label>
      </div>

      <div class="actions">
        <span class="selection" id="selection">0 selected</span>
        <button class="button ghost" id="cancel" type="button">Cancel</button>
        <button class="button primary" id="send" type="button" disabled>Download 0 links</button>
      </div>

      <p class="note" id="note">
        The app downloads each link itself. A file behind a sign-in, or a link
        that has expired, may fail there instead.
      </p>
    </footer>

    <script src="../lib/settings.js"></script>
    <script src="../lib/link-rules.js"></script>
    <script src="links.js"></script>
  </body>
</html>
