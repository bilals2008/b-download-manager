# One workspace for the whole Rust side. Before this, src-tauri, idm-core and
# idm-cli were standalone packages with their own lockfiles, so CI's
# `cargo test --manifest-path src-tauri/Cargo.toml` silently skipped the
# engine crate's tests and compiled it a second time as a path dependency.
# `cargo test --workspace` now runs every test in the repository.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/idm-cli", "crates/idm-core", "crates/idm-archive", "crates/idm-crash", "crates/idm-debrid", "crates/idm-torrent", "crates/idm-mcp", "crates/idm-remote"]

# Cargo reads profiles only from the workspace root manifest. This block moved
# here verbatim from src-tauri/Cargo.toml — leaving it there would have
# silently dropped LTO, size optimisation, panic=abort and stripping from
# every release bundle.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The dev profile is the one that filled the disk: full debug info for every
# crate is several times the size of the code it describes, and a `.pdb` beside
# every binary doubles that again. Line tables keep panic backtraces readable
# as file and line, which is all a reader of those backtraces needs, at a
# fraction of the size. No dependency needs even that: a backtrace through one
# is still named, and no one steps into it.
#
# Incremental stays on. It is what makes a rebuild seconds instead of a full
# compile, and with one profile for every command it is reused instead of
# piling up a new cache per environment variable.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

