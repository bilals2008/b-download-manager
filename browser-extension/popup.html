<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B Download Manager</title>
    <style>
      body {
        width: 15rem;
        margin: 0;
        padding: 0.75rem;
        font: 12px system-ui, sans-serif;
        color: #12170d;
        background: #f8faf5;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        margin: 0 0 0.5rem;
        font-size: 12px;
        font-weight: 600;
      }
      label {
        display: flex;
        gap: 0.5rem;
        align-items: flex-start;
        line-height: 1.4;
      }
      p {
        margin: 0.5rem 0 0;
        color: #4c5a45;
      }
      /* The pairing code is one long run of characters. */
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        margin-block-start: 0.25rem;
        padding: 0.3rem 0.4rem;
        border: 1px solid #cbd6c4;
        border-radius: 5px;
        font: 11px ui-monospace, Consolas, monospace;
        color: inherit;
        background: #fff;
      }
      .field {
        display: block;
        margin-block-start: 0.75rem;
        color: #4c5a45;
      }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon-48.png" alt="" width="18" height="18" />B Download Manager</h1>
    <label>
      <input type="checkbox" id="takeover" />
      <span>Take over the downloads the browser starts</span>
    </label>
    <label class="field">
      <span>Pairing code from the app</span>
      <input
        type="text"
        id="token"
        spellcheck="false"
        autocomplete="off"
        placeholder="Settings, Browser integration"
      />
    </label>
    <p id="pair">Paste the code to pair this browser with the app.</p>
    <p id="state">The application has to be running.</p>
    <script src="popup.js"></script>
  </body>
</html>
