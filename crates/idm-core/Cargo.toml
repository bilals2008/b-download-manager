[package]
name = "idm-core"
version = "0.1.0"
description = "The download engine of my-idm-clone"
edition = "2021"
rust-version = "1.77"

[lib]
name = "idm_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
