[package]
name = "idm-crash"
version = "0.1.0"
description = "The crash monitor and freeze detector of the download manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "idm_crash"
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
