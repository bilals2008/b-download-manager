[package]
name = "idm-crash"
version = "0.1.0"
description = "The crash monitor and freeze detector of the download manager"
edition = "2021"
rust-version = "1.88"

[lib]
name = "idm_crash"
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
