[package]
name = "idm-debrid"
version = "0.1.0"
description = "The debrid services the download engine can unlock a link with"
edition = "2021"
rust-version = "1.77"

[lib]
name = "idm_debrid"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
url = "2"
